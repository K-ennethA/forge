[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-mcp"
version = "0.1.0"
description = "Forge MCP server: drives the Blender Forge add-on (TCP 9876) and the Build123d geometry service (HTTP 8765) from Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forge" }]
keywords = ["mcp", "blender", "build123d", "cad", "3d-printing"]

dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer (mcp.server.mcpserver); forge_mcp.server
    # uses that name, so 1.x will not import. Pin to the 2.x line.
    "mcp>=2.0,<3",
    "httpx>=0.27",
    # Phase 19 (floor plans). forge_mcp/floorplan.py imports service/floorplan.py
    # directly — there is no HTTP route for the plan contract — and that module
    # imports numpy at the top for its `plan_mask` rasteriser. It is the ONE
    # wheel this server pulls in for a service module (maker mode's three are
    # stdlib + math, and the geometry half stays in the service's venv). numpy
    # is not imported by forge_mcp itself and nothing here rasterises anything;
    # it is the cost of not keeping a second copy of the plan schema.
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forge-mcp = "forge_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["forge_mcp"]

[tool.setuptools.package-data]
forge_mcp = ["py.typed"]
