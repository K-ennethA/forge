<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" fill="#222">Werewolf player character — three forms (schematic, to scale)</text>

  <line x1="40" y1="560" x2="960" y2="560" stroke="#333" stroke-width="2"/>

  <text x="170" y="55" text-anchor="middle" font-size="14" fill="#333">Form A — Human · 188 cm (6'2")</text>
  <text x="490" y="55" text-anchor="middle" font-size="14" fill="#333">Form B — Teen-wolf · 188 cm (same skeleton)</text>
  <text x="810" y="55" text-anchor="middle" font-size="14" fill="#333">Form C — Full werewolf · 244 cm (8'0", superset skeleton)</text>

  <!-- dimension lines -->
  <g stroke="#888" stroke-width="1.5">
    <line x1="60" y1="278" x2="60" y2="560"/>
    <line x1="52" y1="278" x2="68" y2="278"/>
    <line x1="52" y1="560" x2="68" y2="560"/>
    <line x1="380" y1="278" x2="380" y2="560"/>
    <line x1="372" y1="278" x2="388" y2="278"/>
    <line x1="372" y1="560" x2="388" y2="560"/>
    <line x1="940" y1="194" x2="940" y2="560"/>
    <line x1="932" y1="194" x2="948" y2="194"/>
    <line x1="932" y1="560" x2="948" y2="560"/>
  </g>
  <text x="30" y="422" font-size="12" fill="#555">188 cm</text>
  <text x="350" y="422" font-size="12" fill="#555">188 cm</text>
  <text x="946" y="380" font-size="12" fill="#555">244 cm</text>

  <!-- Form A: human -->
  <g fill="#cfe0f3" stroke="#274472" stroke-width="3">
    <circle cx="170" cy="295" r="17"/>
    <line x1="170" y1="312" x2="170" y2="320"/>
    <rect x="142" y="320" width="56" height="94" rx="20"/>
    <rect x="138" y="404" width="64" height="22" rx="10"/>
    <line x1="132" y1="320" x2="122" y2="440"/>
    <line x1="208" y1="320" x2="218" y2="440"/>
    <circle cx="122" cy="440" r="6"/>
    <circle cx="218" cy="440" r="6"/>
    <line x1="142" y1="414" x2="142" y2="560"/>
    <line x1="198" y1="414" x2="198" y2="560"/>
    <rect x="132" y="556" width="20" height="8" rx="2"/>
    <rect x="188" y="556" width="20" height="8" rx="2"/>
  </g>

  <!-- Form B: teen-wolf (identical body to Form A, shifted +320) -->
  <g fill="#cfe0f3" stroke="#274472" stroke-width="3">
    <circle cx="490" cy="295" r="17"/>
    <line x1="490" y1="312" x2="490" y2="320"/>
    <rect x="462" y="320" width="56" height="94" rx="20"/>
    <rect x="458" y="404" width="64" height="22" rx="10"/>
    <line x1="452" y1="320" x2="442" y2="440"/>
    <line x1="528" y1="320" x2="538" y2="440"/>
    <circle cx="442" cy="440" r="6"/>
    <circle cx="538" cy="440" r="6"/>
    <line x1="462" y1="414" x2="462" y2="560"/>
    <line x1="518" y1="414" x2="518" y2="560"/>
    <rect x="452" y="556" width="20" height="8" rx="2"/>
    <rect x="508" y="556" width="20" height="8" rx="2"/>
  </g>
  <!-- Form B head deltas: shape keys + material swap, drawn in gold -->
  <g fill="#e8c34a" stroke="#7a5b00" stroke-width="1.5">
    <polygon points="480,280 472,254 488,280"/>
    <polygon points="500,280 508,254 492,280"/>
    <line x1="482" y1="288" x2="498" y2="288" stroke-width="3"/>
    <polygon points="487,304 490,312 493,304" fill="#ffffff"/>
  </g>
  <circle cx="485" cy="294" r="6" fill="#ffd54a" fill-opacity="0.35" stroke="none"/>
  <circle cx="495" cy="294" r="6" fill="#ffd54a" fill-opacity="0.35" stroke="none"/>
  <circle cx="485" cy="294" r="2.5" fill="#ffd54a" stroke="none"/>
  <circle cx="495" cy="294" r="2.5" fill="#ffd54a" stroke="none"/>
  <g font-size="11" fill="#333" stroke="none">
    <line x1="505" y1="260" x2="555" y2="245" stroke="#999" stroke-width="1"/>
    <text x="558" y="248">pointed ears</text>
    <line x1="498" y1="288" x2="555" y2="265" stroke="#999" stroke-width="1"/>
    <text x="558" y="268">ridged brow</text>
    <line x1="497" y1="294" x2="555" y2="285" stroke="#999" stroke-width="1"/>
    <text x="558" y="288">glowing gold eyes (emissive)</text>
    <line x1="493" y1="306" x2="555" y2="305" stroke="#999" stroke-width="1"/>
    <text x="558" y="308">fangs</text>
  </g>

  <!-- Form C: full werewolf -->
  <g fill="#8a7360" stroke="#3b2f22" stroke-width="3">
    <ellipse cx="810" cy="221" rx="34" ry="27"/>
    <line x1="810" y1="248" x2="810" y2="258"/>
    <rect x="752" y="258" width="116" height="122" rx="30"/>
    <polyline points="752,258 728,348 713,438" fill="none"/>
    <polyline points="868,258 892,348 907,438" fill="none"/>
    <circle cx="713" cy="438" r="9"/>
    <circle cx="907" cy="438" r="9"/>
    <polyline points="780,380 774,470 790,525 766,560" fill="none"/>
    <polyline points="840,380 846,470 830,525 854,560" fill="none"/>
    <rect x="756" y="556" width="20" height="8" rx="2"/>
    <rect x="844" y="556" width="20" height="8" rx="2"/>
  </g>
  <path d="M810,380 C845,405 865,450 862,500 C860,520 850,535 835,545" fill="none" stroke="#3b2f22" stroke-width="8" stroke-linecap="round"/>

  <!-- Form C callout markers -->
  <g font-size="12" fill="#111">
    <circle cx="830" cy="525" r="10" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="830" y="529" text-anchor="middle">1</text>
    <circle cx="892" cy="348" r="10" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="892" y="352" text-anchor="middle">2</text>
    <circle cx="850" cy="520" r="10" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="850" y="524" text-anchor="middle">3</text>
    <circle cx="810" cy="265" r="10" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
    <text x="810" y="269" text-anchor="middle">4</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <text x="40" y="605">① digitigrade ankle — foot_metatarsal bone; ~18 cm of the total 244 cm height comes from this segment alone (not present on Forms A/B)</text>
    <text x="40" y="628">② elongated forearm — combat reach ≈1.5 m from torso center (Form A/B reach ≈1.0 m)</text>
    <text x="40" y="651">③ full tail, ~85 cm, properly proportioned — not a stub. 6-bone chain (tail_01..06). Exact length is a placeholder estimate, no reference yet.</text>
    <text x="40" y="674">④ extra spine bone — forward-leaning hunch posture (Forms A/B use 3 spine bones, Form C uses 4)</text>
    <text x="40" y="700">Form B deltas (gold): ridged brow, pointed ears, fangs, glowing gold eyes — shape keys + material swap only, zero change to skeleton or reach.</text>
    <text x="40" y="723">Solid fill throughout = shared skeleton bones, identical names, Form A/B → Form C. Transformation timing/state-carry rules are in requirements.md §4, not shown here.</text>
    <text x="40" y="746">Schematic proportions, not final geometry. Heights 188 / 188 / 244 cm at 1.5 px per cm.</text>
  </g>
</svg>
